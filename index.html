<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Regalinspektion">
<title>Regalinspektion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Gleiche Formensprache wie Sicherheitsregister und Zählerprüfung:
   Kopfleiste mit Speicher-Anzeige, Kacheln als Filter, Tab-Leiste unten, eine Spalte */
:root{
  --ground:#E9EDEE; --surface:#FFFFFF; --surface-2:#F3F6F6;
  --ink:#0F1618; --ink-2:#48595D; --ink-3:#78898D;
  --line:#D2DADB; --line-strong:#B4C0C2;
  --accent:#0B6E77; --accent-ink:#FFFFFF; --accent-soft:#DCEDEE;
  --ok:#2C7A52; --ok-soft:#DCEDE3; --warn:#9C6B00; --warn-soft:#F7EBCE; --crit:#B3122C; --crit-soft:#F8DCE1;
  --tape:#F2C230; --tape-ink:#1B211F; --status-ink:#FFFFFF;
  --rot:var(--crit); --gelb:var(--tape); --gruen:var(--ok);
  --shadow:0 1px 2px rgba(15,22,24,.08),0 6px 18px rgba(15,22,24,.06);
  --r:6px;
  --f-ui:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-disp:Archivo,"Arial Narrow",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;min-height:58px}
.topbar .back{background:none;border:0;min-width:44px;min-height:44px;font-size:30px;line-height:1;color:var(--accent);cursor:pointer;padding:0 4px;margin-left:-6px}
.mark{width:32px;height:32px;border-radius:4px;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .78rem var(--f-disp)}
.mark.haslogo{background:transparent;width:auto;max-width:90px}
.mark.haslogo img{height:30px;width:auto;display:block}
.tt{min-width:0;flex:1}
.topbar h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.topbar .sub{font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.synckn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font:600 .76rem var(--f-ui);white-space:nowrap;flex:none}
.synckn .punkt{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.synckn.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}.synckn.ok .punkt{background:var(--ok)}
.synckn.laeuft .punkt{background:var(--accent);animation:puls 1s ease-in-out infinite}
.synckn.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}.synckn.crit .punkt{background:var(--crit)}
@keyframes puls{50%{opacity:.25}}
#upd{position:sticky;top:0;z-index:49;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600}
#upd span{flex:1}
#upd button{min-height:44px;border:0;border-radius:var(--r);background:var(--accent-ink);color:var(--accent);font:700 .95rem var(--f-disp);padding:0 14px;cursor:pointer}
#err{position:sticky;top:0;z-index:50;background:var(--crit);color:var(--status-ink);font-weight:600;padding:12px 14px;font-size:.95rem}

main{padding:12px 12px 110px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Tab-Leiste */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 .64rem var(--f-disp);letter-spacing:.04em;text-transform:uppercase;min-height:60px;border-top:2px solid transparent;margin-top:-1px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabbar button.plus{color:var(--status-ink);background:var(--crit);border-radius:14px;margin:6px 6px 4px;min-height:52px;border-top:0}
.tabbar button.plus svg{stroke-width:2.6}

/* Karten, Felder, Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.tight{padding:10px 12px;gap:8px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card h2,.eyebrow{font:600 .7rem var(--f-disp);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0}
label.f{display:flex;flex-direction:column;gap:5px;font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],select,textarea{width:100%;min-height:50px;border:1px solid var(--line-strong);
  border-radius:var(--r);padding:10px 12px;background:var(--surface);font:400 1rem var(--f-ui);color:var(--ink);text-transform:none;letter-spacing:0}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 .92rem var(--f-disp);
  padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:60px;font-size:1.02rem;width:100%}
.btn.warn{border-color:var(--crit);color:var(--crit)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:.85rem;color:var(--ink-2)}
.hint{font-size:.85rem;color:var(--ink-3);margin:0}
.banner{padding:10px 12px;border-radius:var(--r);font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.92rem}

/* Grosse Aktion (Startseite) */
.gross-aktion{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:8px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.gross-aktion svg{width:38px;height:38px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gross-aktion b{display:block;font:700 1.18rem var(--f-disp)}
.gross-aktion small{display:block;font-size:.88rem;opacity:.85;margin-top:2px}

/* Kacheln */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);
  padding:9px 8px;text-align:left;cursor:pointer;width:100%;min-height:68px}
.stat .n{display:block;font:700 1.7rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:.68rem;color:var(--ink-2);margin-top:5px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat.rot{border-top-color:var(--rot)}.stat.rot .n{color:var(--crit)}
.stat.gelb{border-top-color:var(--gelb)}.stat.gelb .n{color:var(--warn)}
.stat.gruen{border-top-color:var(--gruen)}.stat.gruen .n{color:var(--ok)}
.stat.z{border-top-color:var(--accent)}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress .zahl{font:500 .8rem var(--f-mono);color:var(--ink-2);white-space:nowrap}

/* Chips und Ampel */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:46px;padding:8px 13px;border-radius:24px;border:1px solid var(--line-strong);background:var(--surface);font-size:.95rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.amps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amp{min-height:74px;border-radius:8px;border:2px solid transparent;font:700 1.1rem var(--f-disp);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px}
.amp small{font:600 .72rem var(--f-ui);margin-top:4px}
.amp.rot{background:var(--crit-soft);color:var(--crit)} .amp.rot.on{background:var(--rot);color:#fff;border-color:var(--ink)}
.amp.gelb{background:var(--warn-soft);color:var(--warn)} .amp.gelb.on{background:var(--gelb);color:var(--tape-ink);border-color:var(--ink)}
.amp.gruen{background:var(--ok-soft);color:var(--ok)} .amp.gruen.on{background:var(--gruen);color:#fff;border-color:var(--ink)}
.amps.missing .amp{border-color:var(--crit);border-style:dashed}
.stepper{display:grid;grid-template-columns:50px 1fr 50px;gap:6px;align-items:center}
.stepper button{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper input{text-align:center;font-family:var(--f-mono)}

/* Listen wie im Sicherheitsregister */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;
  width:100%;text-align:left;min-height:62px;color:inherit}
.list>:last-child,.list>:last-child .item{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:.8rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.zrow .item{border-bottom:0}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dot{min-width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font:700 .85rem var(--f-disp);padding:0 6px}
.dot.rot{background:var(--rot);color:#fff}.dot.gelb{background:var(--gelb);color:var(--tape-ink)}.dot.gruen{background:var(--gruen);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 .68rem var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.offen{background:var(--surface-2);color:var(--ink-2)}.pill.io{background:var(--ok-soft);color:var(--ok)}.pill.gp{background:var(--accent-soft);color:var(--accent)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.qio{min-width:74px;border:0;border-left:1px solid var(--line);background:var(--ok-soft);color:var(--ok);font:700 .9rem var(--f-disp);cursor:pointer}
.mg{box-shadow:inset 6px 0 0 var(--line-strong)}
.mg.rot{box-shadow:inset 6px 0 0 var(--rot)}.mg.gelb{box-shadow:inset 6px 0 0 var(--gelb)}.mg.gruen{box-shadow:inset 6px 0 0 var(--gruen)}
.mg img{width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none;border:1px solid var(--line)}
.nr{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:6px}
.lb{font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 11px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px!important}
.check{border-bottom:1px solid var(--line);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.check:last-child{border-bottom:0}
.check.hatm{box-shadow:inset 4px 0 0 var(--crit)}
.check .q{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:8px}
.check .lt{flex:1;min-width:0}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);font-size:1.1rem;cursor:pointer}
.hp{font-size:.88rem;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;line-height:1.45}
.check .code{font:600 .72rem var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2);margin-top:2px}
details.info{margin-left:auto}
details.info summary{list-style:none;cursor:pointer;color:var(--accent);font-size:1.15rem;min-width:36px;min-height:32px;text-align:center}
details.info summary::-webkit-details-marker{display:none}
details.info p{font-weight:400;font-size:.88rem;color:var(--ink-2);margin:4px 0 0;flex-basis:100%}
details.info[open]{flex-basis:100%;margin-left:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);min-height:48px;cursor:pointer;font:600 .85rem var(--f-disp);color:var(--ink-2)}
.seg button[data-on="ok"]{background:var(--ok);border-color:var(--ok);color:var(--status-ink)}
.seg button[data-on="mangel"],.seg button[data-on="fehlt"]{background:var(--crit);border-color:var(--crit);color:var(--status-ink)}
.seg button[data-on="nv"],.seg button[data-on="na"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
body.gross .seg button{min-height:58px;font-size:.95rem}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line-strong);border-left:5px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:7px 10px;min-height:44px;cursor:pointer;font-size:.88rem;text-align:left;color:var(--ink)}
.mchip b{font-family:var(--f-mono)}
.mchip.rot{border-left-color:var(--rot)}.mchip.gelb{border-left-color:var(--gelb)}.mchip.gruen{border-left-color:var(--gruen)}
.check textarea{min-height:60px}
.kl{display:flex;flex-direction:column;gap:4px}
.kl input{font:700 1.5rem var(--f-mono);text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick .chip{border-radius:var(--r);text-align:left;line-height:1.2;padding:8px 10px;font-size:.9rem}
body.gross .quick .chip{font-size:.95rem;padding:8px 10px}
.filterchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filterchips .chip{flex:none}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--surface-2);max-width:100%;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;cursor:pointer}

/* Speicherleiste im Mangel */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.bar .btn{flex:1;min-height:56px;font-size:1rem}
.sig{width:100%;height:170px;border:1px dashed var(--line-strong);border-radius:var(--r);background:#fff;touch-action:none;display:block}

/* Sicherungsstatus */
.bk{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:9px 12px}
.bk.ok{background:var(--ok-soft);color:var(--ok)}
.bk div{flex:1;min-width:0}.bk b{display:block;font-size:.9rem}.bk span{font-size:.78rem;opacity:.9}
.bk .btn{min-height:44px;flex:none;background:var(--surface)}

/* Hilfe wie im Sicherheitsregister */
.help{background:var(--accent-soft)}
.help p{margin:0;font-size:.92rem}
.mess{display:flex;flex-direction:column;gap:8px}
details.hilfe{border-bottom:1px solid var(--line)}
details.hilfe:last-child{border-bottom:0}
details.hilfe summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:54px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.hilfe summary::-webkit-details-marker{display:none}
details.hilfe summary::after{content:'+';font-size:1.4rem;color:var(--accent);font-weight:400}
details.hilfe[open] summary::after{content:'−'}
details.hilfe>div{padding:0 16px 14px;color:var(--ink-2);font-size:.95rem;line-height:1.55}
details.hilfe p{margin:0 0 8px}
.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card>summary{list-style:none;min-height:40px;display:flex;align-items:center;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::after{content:" +";color:var(--accent);font-size:1rem}
details.card[open]>summary h2::after{content:" −"}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.rptbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center}
#rptview{background:#fff;color:#111}
#rptview .rp{padding:12px}

/* Handschuhmodus */

.hd img{max-height:52px;max-width:180px;background:#fff;border-radius:6px;padding:4px}
.hd h1{margin:0;font-size:22px}.hd p{margin:2px 0 0;opacity:.85;font-size:14px}
.hd .t{flex:1;min-width:200px}
.hd .act{display:flex;gap:8px;flex-wrap:wrap}
.b{min-height:44px;border-radius:8px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
.b.w{border-color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{border:2px solid transparent;border-radius:10px;padding:10px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.kpi.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.kpi.rot b{color:var(--rot)}.kpi.gelb b{color:#a37300}.kpi.gruen b{color:var(--gruen)}
.flt{background:var(--card);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.flt input,.flt select{min-height:44px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:#fff;width:100%}
.flt .q{grid-column:1/-1}
.cnt{font-size:14px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:10px}
.m{background:var(--card);border-radius:10px;border:1px solid var(--line);border-left:8px solid var(--line);padding:12px;display:grid;grid-template-columns:1fr;gap:8px}
.m.rot{border-left-color:var(--rot)}.m.gelb{border-left-color:var(--gelb)}.m.gruen{border-left-color:var(--gruen)}
.mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mh b{font-size:18px}
.bd{font-size:12px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:5px;color:#fff}
.bd.rot{background:var(--rot)}.bd.gelb{background:var(--gelb);color:#1d1600}.bd.gruen{background:var(--gruen)}
.st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:5px;background:#dfe6ee;color:var(--mut);margin-left:auto}
.st.arbeit{background:#fff4d1;color:#6b4d00}.st.behoben{background:#e3f3e4;color:var(--gruen)}
.dl{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;font-size:15px}
.dl dt{color:var(--mut)}.dl dd{margin:0;min-width:0}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph img{width:110px;height:110px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.ed{border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:auto 160px;gap:8px;align-items:center}
.seg{display:flex;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--brand);font:inherit;font-weight:700;min-height:42px;padding:0 10px;cursor:pointer;flex:1}
.seg button.on{background:var(--brand);color:#fff}
.ed input,.ed textarea{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-height:42px;width:100%;background:#fff}
.ed textarea{grid-column:1/-1;min-height:60px;resize:vertical}
details.info{background:var(--card);border-radius:10px;padding:10px 14px}
details.info summary{cursor:pointer;font-weight:700}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#print{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1b6aa5;outline-offset:1px}
@media (max-width:560px){.ed{grid-template-columns:1fr}.dl{grid-template-columns:96px 1fr}}
.edp{background:var(--card);border:2px solid var(--brand);border-radius:10px;padding:14px}
.edp h2{margin:0 0 4px;font-size:18px}.edp .hint{margin:0 0 10px;color:var(--mut);font-size:14px}
.edp .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.edp label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--mut)}
.edp .w{grid-column:1/-1}
.edp input,.edp select,.edp textarea,.dl select,.dl textarea{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-weight:400;color:var(--ink);min-height:42px;width:100%;background:#fff}
.edp textarea,.dl textarea{min-height:70px;resize:vertical}
@media print{.app,#lb{display:none!important}#print{display:block}body{background:#fff}}
</script>
<script type="text/plain" id="kjs">
var D=JSON.parse(document.getElementById("data").textContent);
var I=D.insp,P=D.photos||{},LOGO=D.logo||"";
var KEY="regalinspektion_rueckmeldung_"+I.id,EKEY="regalinspektion_bearbeitung_"+I.id;
var ST={};try{ST=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){ST={}}
try{var ED=JSON.parse(localStorage.getItem(EKEY));if(ED&&ED.insp&&ED.insp.id===I.id&&(ED.insp.editStamp||0)>(I.editStamp||0)){I=ED.insp;if(ED.logo)LOGO=ED.logo}}catch(e){}
function saveST(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function saveED(){I.editStamp=Date.now();try{localStorage.setItem(EKEY,JSON.stringify({insp:I,logo:LOGO}))}catch(e){}}
var L,NR;function recalc(){L=sortedMaengel(I);NR=nummern(I)}recalc();
var EDIT=false;
var F={q:"",stufe:"",zeile:"",bauteil:"",art:"",status:"",sort:"stufe"};
function kst(m){return (ST[m.id]&&ST[m.id].status)||"offen"}
function $(s){return document.querySelector(s)}
function opts(arr,sel,all){return (all!=null?'<option value="">'+all+'</option>':'')+arr.map(function(v){var val=typeof v==="object"?v.v:v,lab=typeof v==="object"?v.l:v;return '<option value="'+esc(val)+'"'+(sel===val?" selected":"")+'>'+esc(lab)+'</option>'}).join("")}
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i})}
function init(){
  $(".app").innerHTML='<div class="hd" id="hd"></div><div class="edp" id="edp" hidden></div><div class="kpis" id="kpis"></div><details class="info" id="info"></details>'
  +'<div class="flt"><input class="q" id="fq" type="search" placeholder="Suchen: Nummer, Position, Bauteil, Beschreibung …">'
  +'<select id="fstufe">'+opts([{v:"rot",l:"Rot"},{v:"gelb",l:"Gelb"},{v:"gruen",l:"Grün"}],"","Alle Stufen")+'</select>'
  +'<select id="fzeile">'+opts(I.zeilen.map(function(z){return {v:z.id,l:rName(z)}}),"","Alle Regale")+'</select>'
  +'<select id="fbauteil">'+opts(uniq(L.map(function(m){return m.bauteil})),"","Alle Bauteile")+'</select>'
  +'<select id="fart">'+opts(uniq(L.map(function(m){return m.art})),"","Alle Schadensarten")+'</select>'
  +'<select id="fstatus">'+opts([{v:"offen",l:"offen"},{v:"arbeit",l:"in Arbeit"},{v:"behoben",l:"behoben"}],"","Alle Status")+'</select>'
  +'<select id="fsort"><option value="stufe">Sortierung: Stufe</option><option value="nr">Sortierung: Nummer</option><option value="zeile">Sortierung: Regal</option><option value="frist">Sortierung: Frist</option></select></div>'

  $("#hd").addEventListener("click",onHead);
  $("#edp").addEventListener("input",onPanel);$("#edp").addEventListener("change",onPanel);
  $("#lb").addEventListener("click",function(){this.hidden=true});
  $("#list").addEventListener("click",onList);
  $("#list").addEventListener("change",onEdit);
  $("#list").addEventListener("input",onEdit);
  $("#kpis").addEventListener("click",function(e){var b=e.target.closest(".kpi");if(!b)return;var k=b.dataset.k,v=b.dataset.v;
    if(k==="all"){F.stufe="";F.status=""}else{F[k]=F[k]===v?"":v}
    $("#fstufe").value=F.stufe;$("#fstatus").value=F.status;render()});
  head();info();render();

function head(){
  $("#hd").innerHTML=(LOGO?'<img src="'+LOGO+'" alt="Logo">':'')+'<div class="t"><h1>Regalinspektion '+esc(I.kunde||"")+'</h1><p>'+esc(I.standort||"")+(I.standort?' · ':'')+fDate(I.datum)+' · Prüfer '+esc(I.pruefer)+' · DIN EN 15635</p></div><div class="act">'
  +(EDIT?'<button class="b w" data-h="savehtml">Als HTML-Datei speichern</button><button class="b w" data-h="edit">Bearbeiten beenden</button>':'<button class="b w" data-h="edit">Bearbeiten</button><button class="b w" data-h="exp">Rückmeldung exportieren</button>')
  +'<button class="b w" data-h="print">Drucken / PDF</button></div>';
}
function headText(){var t=document.querySelector("#hd .t");if(t)t.innerHTML='<h1>Regalinspektion '+esc(I.kunde||"")+'</h1><p>'+esc(I.standort||"")+(I.standort?' · ':'')+fDate(I.datum)+' · Prüfer '+esc(I.pruefer)+' · DIN EN 15635</p>'}
function info(){
  $("#info").innerHTML='<summary>Ampelsystem und Hinweise</summary><p><b style="color:var(--rot)">Rot:</b> '+esc(STUFEN.rot.t)+'<br><b style="color:#a37300">Gelb:</b> '+esc(STUFEN.gelb.t)+'<br><b style="color:var(--gruen)">Grün:</b> '+esc(STUFEN.gruen.t)+'</p><p>Sie können pro Mangel den Status, ein Erledigungsdatum und eine Notiz eintragen. Die Angaben bleiben in diesem Browser gespeichert. Mit «Rückmeldung exportieren» erhalten Sie eine Datei, die Sie an '+esc((I.firma&&I.firma.email)||"den Prüfer")+' zurücksenden.</p>'+(I.gesamt?'<p><b>Gesamtbeurteilung:</b> '+nl(I.gesamt)+'</p>':'')+'<p>Nächste Inspektion: <b>'+fDate(I.naechste||addMonths(I.datum,12))+'</b></p>';
}
function panel(){
  function t(k,l,type){return '<label>'+l+'<input type="'+(type||"text")+'" data-p="'+k+'" value="'+esc(I[k]||"")+'"></label>'}
  $("#edp").innerHTML='<h2>Berichtsdaten bearbeiten</h2><p class="hint">Änderungen werden in diesem Browser automatisch gespeichert. Für den Versand: «Als HTML-Datei speichern» oder «Drucken / PDF».</p><div class="g">'
  +t("kunde","Kunde")+t("standort","Standort / Halle")+t("datum","Datum Inspektion","date")+t("pruefer","Prüfer")
  +'<label>Regaltyp<select data-p="regaltyp">'+opts(REGALTYPEN,I.regaltyp,"–")+'</select></label>'+t("hersteller","Hersteller")
  +'<label>Belastungsschild<select data-p="schild">'+opts([{v:"ja",l:"vorhanden"},{v:"nein",l:"nicht vorhanden"}],I.schild,"nicht erfasst")+'</select></label>'
  +t("kundeName","Name Kunde (Unterschrift)")+t("naechste","Nächste Inspektion","date")
  +'<label class="w">Bemerkung<textarea data-p="bemerkung">'+esc(I.bemerkung||"")+'</textarea></label>'
  +'<label class="w">Gesamtbeurteilung<textarea data-p="gesamt">'+esc(I.gesamt||"")+'</textarea></label>'
  +'<label>Logo für Bericht<input type="file" accept="image/*" data-logo="1"></label>'
  +'</div>';
}
function onPanel(e){
  if(e.target.dataset.logo&&e.type==="change"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL("image/jpeg",.9);saveED();head()};im.src=r.result};r.readAsDataURL(f);return}
  var k=e.target.dataset.p;if(!k)return;I[k]=e.target.value;saveED();
  if(e.type==="change"||k==="kunde"||k==="standort"||k==="pruefer"){headText();info()}
}
function onHead(e){
  var b=e.target.closest("[data-h]");if(!b)return;var a=b.dataset.h;
  if(a==="edit"){EDIT=!EDIT;if(EDIT)panel();$("#edp").hidden=!EDIT;head();render();return}
  if(a==="exp")exportST();
  if(a==="savehtml")saveHtml();
  if(a==="print"){$("#print").innerHTML=buildReport(I,P,LOGO,{status:EDIT?null:ST});setTimeout(function(){window.print()},50)}
}
function kpis(){
  var c=countStufen(L),s={offen:0,arbeit:0,behoben:0};L.forEach(function(m){s[kst(m)]++});
  function k(key,v,n,l,cls){var on=key==="all"?(!F.stufe&&!F.status):F[key]===v;return '<button class="kpi '+(cls||"")+(on?" on":"")+'" data-k="'+key+'" data-v="'+v+'"><b>'+n+'</b><span>'+l+'</span></button>'}
  $("#kpis").innerHTML=k("all","",L.length,"Alle Mängel")+k("stufe","rot",c.rot,"Rot","rot")+k("stufe","gelb",c.gelb,"Gelb","gelb")+k("stufe","gruen",c.gruen,"Grün","gruen")+k("status","offen",s.offen,"Offen")+k("status","arbeit",s.arbeit,"In Arbeit")+k("status","behoben",s.behoben,"Behoben");
}
function render(){
  kpis();
  var zi={};I.zeilen.forEach(function(z,i){zi[z.id]=i});
  var r=L.filter(function(m){
    if(F.stufe&&m.stufe!==F.stufe)return false;if(F.zeile&&m.zeileId!==F.zeile)return false;
    if(F.bauteil&&m.bauteil!==F.bauteil)return false;if(F.art&&m.art!==F.art)return false;
    if(F.status&&kst(m)!==F.status)return false;
    if(F.q){var t=(NR[m.id]+" "+posText(m,I)+" "+m.bauteil+" "+m.art+" "+(m.beschreibung||"")+" "+(m.massnahme||"")+" "+((ST[m.id]&&ST[m.id].notiz)||"")).toLowerCase();if(t.indexOf(F.q)<0)return false}
    return true});
  if(F.sort==="nr")r.sort(function(a,b){return (a.nr||0)-(b.nr||0)});
  if(F.sort==="zeile")r.sort(function(a,b){return (zi[a.zeileId]-zi[b.zeileId])||((+a.feld||0)-(+b.feld||0))||(ORDER[a.stufe]-ORDER[b.stufe])});
  if(F.sort==="frist")r.sort(function(a,b){return fristIso(a,I).localeCompare(fristIso(b,I))||(ORDER[a.stufe]-ORDER[b.stufe])});
  $("#cnt").textContent=r.length+" von "+L.length+" Mängeln";
  $("#list").innerHTML=r.map(card).join("")||'<p>Keine Mängel für diese Auswahl.</p>';
}
function card(m){
  var s=ST[m.id]||{},k=kst(m);
  var h='<article class="m '+m.stufe+'" data-id="'+m.id+'"><div class="mh"><b>'+NR[m.id]+'</b><span class="bd '+m.stufe+'">'+STUFEN[m.stufe].l+'</span><span>'+esc(posText(m,I))+'</span>'+(EDIT?'':'<span class="st '+k+'">'+KSTATUS[k]+'</span>')+'</div>';
  if(EDIT){
    h+='<div class="dl"><dt>Stufe</dt><dd><select data-e="stufe">'+opts([{v:"rot",l:"Rot"},{v:"gelb",l:"Gelb"},{v:"gruen",l:"Grün"}],m.stufe)+'</select></dd>'
     +'<dt>Bauteil</dt><dd><select data-e="bauteil">'+opts(BAUTEILE,m.bauteil)+'</select></dd><dt>Schadensart</dt><dd><select data-e="art">'+opts(ARTEN,m.art)+'</select></dd>'
     +'<dt>Beschreibung</dt><dd><textarea data-e="beschreibung">'+esc(m.beschreibung||"")+'</textarea></dd><dt>Massnahme</dt><dd><textarea data-e="massnahme">'+esc(m.massnahme||"")+'</textarea></dd><dt>Frist</dt><dd><b>'+esc(fristText(m,I))+'</b></dd></div>';
  }else{
    h+='<dl class="dl"><dt>Bauteil</dt><dd>'+esc(m.bauteil||"–")+'</dd><dt>Schadensart</dt><dd>'+esc(m.art||"–")+'</dd>'+(m.beschreibung?'<dt>Beschreibung</dt><dd>'+nl(m.beschreibung)+'</dd>':'')+'<dt>Massnahme</dt><dd>'+nl(m.massnahme||"–")+'</dd><dt>Frist</dt><dd><b>'+esc(fristText(m,I))+'</b></dd></dl>';
  }
  h+='<div class="ph">'+(m.fotos||[]).filter(function(id){return P[id]}).map(function(id){return '<img src="'+P[id]+'" alt="Foto" data-lb="'+id+'">'}).join("")+'</div>';
  if(!EDIT)h+='<div class="ed"><div class="seg">'+["offen","arbeit","behoben"].map(function(v){return '<button data-st="'+v+'" class="'+(k===v?"on":"")+'">'+KSTATUS[v]+'</button>'}).join("")+'</div><input type="date" data-f="datum" value="'+esc(s.datum||"")+'" aria-label="Erledigt am"><textarea data-f="notiz" placeholder="Notiz (z. B. Auftrag erteilt an …)">'+esc(s.notiz||"")+'</textarea></div>';
  return h+'</article>';
}
function mById(id){return I.maengel.filter(function(m){return m.id===id})[0]}
function onList(e){
  var im=e.target.closest("[data-lb]");if(im){$("#lb img").src=P[im.dataset.lb];$("#lb").hidden=false;return}
  var b=e.target.closest("[data-st]");if(!b)return;
  var id=b.closest(".m").dataset.id;ST[id]=ST[id]||{};ST[id].status=b.dataset.st;
  if(b.dataset.st==="behoben"&&!ST[id].datum){ST[id].datum=todayIso()}
  ST[id].geaendert=new Date().toISOString();saveST();
  b.closest(".m").outerHTML=card(mById(id));kpis();
}
function onEdit(e){
  var el=e.target,id=el.closest(".m")&&el.closest(".m").dataset.id;if(!id)return;
  if(el.dataset.e){var m=mById(id);m[el.dataset.e]=el.value;if(el.dataset.e==="bauteil"){var bb=btByLabel(el.value);m.bk=bb?bb.k:m.bk}saveED();if(e.type==="change"&&el.tagName==="SELECT"){recalc();render()}return}
  var f=el.dataset.f;if(!f)return;
  ST[id]=ST[id]||{};ST[id][f]=el.value;ST[id].geaendert=new Date().toISOString();saveST();
}
function dl(text,name,mime){
  var blob=new Blob([text],{type:mime}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
}
function fname(s){return String(s||"").trim().replace(/[^\wäöüÄÖÜ-]+/g,"_")||"Kunde"}
function exportST(){
  var out={format:"regalinspektion-rueckmeldung-v1",inspId:I.id,kunde:I.kunde,standort:I.standort,datum:I.datum,exportiert:new Date().toISOString(),status:{}};
  L.forEach(function(m){if(ST[m.id])out.status[m.id]=Object.assign({nr:NR[m.id]},ST[m.id])});
  dl(JSON.stringify(out,null,1),"Rueckmeldung_"+fname(I.kunde)+"_"+todayIso()+".json","application/json");
}
function saveHtml(){
  var data=JSON.stringify({insp:I,photos:P,logo:LOGO}).replace(/</g,"\\u003c");
  var html='<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>Regalinspektion '+esc(I.kunde||"")+' '+fDate(I.datum)+'</title><style id="kst">'+document.getElementById("kst").textContent+'</style></head><body>'
    +'<div class="app"></div><div id="print"></div><div id="lb" hidden><img alt="Foto gross"></div>'
    +'<script type="application/json" id="data">'+data+'<\/script>'
    +'<script id="shared">'+document.getElementById("shared").textContent+'<\/script><script id="kjs">'+document.getElementById("kjs").textContent+'<\/script></body></html>';
  dl(html,"Regalinspektion_"+fname(I.kunde)+"_"+I.datum+".html","text/html");
}
init();
</script>

<script>
"use strict";
var DEF_FIRMA={name:"DETEC Facility Services",pruefer:"Dominik Lüthi",email:"dominik.luethi@detec-fs.ch"};
var I=null, SET={firma:Object.assign({},DEF_FIRMA),logo:""}, LAST={}, PH=new Map(), V={v:"home"};
var $=function(s){return document.querySelector(s)};
var main=$("#main");
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function slug(s){return String(s||"").trim().replace(/[^\wäöüÄÖÜ-]+/g,"_").replace(/^_+|_+$/g,"")||"ohne_Name"}

/* ---------- IndexedDB ---------- */
var dbp=null;
function db(){
  if(!dbp)dbp=new Promise(function(res,rej){
    var r=indexedDB.open("regalinspektion",1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("insp",{keyPath:"id"});d.createObjectStore("photos",{keyPath:"id"});d.createObjectStore("meta",{keyPath:"k"})};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
  return dbp;
}
function tx(store,mode,fn){
  return db().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction(store,mode),s=t.objectStore(store),out,r=fn(s);
    if(r)r.onsuccess=function(){out=r.result};
    t.oncomplete=function(){res(out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error("Speichern abgebrochen"))};
  })});
}
function dput(st,v){return tx(st,"readwrite",function(s){return s.put(v)})}
function dget(st,k){return tx(st,"readonly",function(s){return s.get(k)})}
function dall(st){return tx(st,"readonly",function(s){return s.getAll()})}

/* ---------- Speichern ----------
   Jede Änderung wird sofort in IndexedDB geschrieben (seriell, keine Überholungen)
   und zusätzlich als Textkopie (ohne Fotos) in localStorage gespiegelt. */
var writing=false,dirty=false,saveErr=null,waiters=[];
function mirror(){try{localStorage.setItem("ri_spiegel_"+I.id,JSON.stringify(I))}catch(e){}}
function setSaved(t){var e=$("#saved");if(!e)return;var st=/NICHT/.test(t)?"crit":t==="…"?"laeuft":"ok";e.className="synckn "+st;$("#savedT").textContent=st==="crit"?"Nicht gespeichert":st==="laeuft"?"Speichert …":"Gespeichert"}
function save(){ if(!I)return; I.updated=Date.now(); mirror(); dirty=true; setSaved("…"); pump(); }
function pump(){
  if(writing||!dirty||!I)return;
  writing=true;dirty=false;var copy=JSON.parse(JSON.stringify(I));
  dput("insp",copy).then(function(){
    writing=false;if(saveErr){saveErr=null;errBanner("")}
    if(dirty){pump();return}
    setSaved("gespeichert ✓");var w=waiters;waiters=[];w.forEach(function(f){f()});
  }).catch(function(e){
    writing=false;dirty=true;saveErr=e;setSaved("NICHT gespeichert");
    errBanner("Speichern auf dem Gerät fehlgeschlagen ("+(e&&e.name||e)+"). Die Texte sind als Kopie gesichert, neue Fotos evtl. nicht. Sofort «Sicherung jetzt» machen.");
    setTimeout(pump,2000);
    var w=waiters;waiters=[];w.forEach(function(f){f()});
  });
}
function flushSave(){ if(!writing&&!dirty)return Promise.resolve(); return new Promise(function(res){waiters.push(res);pump()}); }
function saveMeta(k,v){return dput("meta",{k:k,v:v}).catch(function(){})}
function errBanner(t){var b=$("#err");b.textContent=t;b.hidden=!t}

   WICHTIG bei jedem Update: APP_V hier UND VERSION in sw.js gleich hochzählen. */
var APP_V="regal-v5",SWREG=null,updT=0;
function vNr(v){return String(v||"").replace(/^regal-v/,"")}
function updCheck(manuell){
  if(!navigator.onLine){if(manuell)toast("Kein Netz – Update später prüfen");return}
  if(!manuell&&Date.now()-updT<60000)return;updT=Date.now();
  fetch("sw.js?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/VERSION\s*=\s*'([^']+)'/);if(!m)return;
    if(m[1]!==APP_V){var b=$("#upd");b.querySelector("span").textContent="Neue Version "+vNr(m[1])+" verfügbar";b.hidden=false}
    else if(manuell)toast("Die App ist aktuell (Version "+vNr(APP_V)+")");
  }).catch(function(){if(manuell)toast("Update-Prüfung nicht möglich")});
}
function updJetzt(){
  var b=$("#upd");b.querySelector("span").textContent="Wird aktualisiert …";
  flushSave().then(function(){return SWREG?SWREG.update().catch(function(){}):null}).then(function(){
    setTimeout(function(){location.reload()},800);
  });
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){pump()}else{wake();updCheck()}});

function resizeImg(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Bild konnte nicht gelesen werden"))};
    img.src=url;
  });
}

function parseNames(s){
  var out=[];String(s).split(/[,;\n]+/).forEach(function(t){
    t=t.trim();if(!t)return;var m;
    if((m=t.match(/^([A-Za-z])\s*-\s*([A-Za-z])$/))){var a=m[1].toUpperCase().charCodeAt(0),b=m[2].toUpperCase().charCodeAt(0);if(a<=b)for(var i=a;i<=b;i++)out.push(String.fromCharCode(i));return}
    if((m=t.match(/^(\D*?)(\d+)\s*-\s*\D*?(\d+)$/))){var x=+m[2],y=+m[3];if(x<=y&&y-x<500)for(var j=x;j<=y;j++)out.push(m[1]+j);return}
    out.push(t);
  });return out;
}

  if(!m.stufe){var a=$("#amps");if(a){a.classList.add("missing");a.scrollIntoView({behavior:"smooth",block:"center"})}toast("Bitte Gefährdungsstufe wählen");return false}
  return true;
}

  h+='<div class="card"><label class="f">Gesamtbeurteilung<textarea data-b="gesamt" id="ges">'+esc(I.gesamt)+'</textarea></label><button class="btn" data-act="gesVorschlag">Vorschlag einsetzen</button></div>';
  h+='<div class="card"><label class="f">Nächste Inspektion<input type="date" data-b="naechste" id="nx" value="'+esc(I.naechste)+'"></label></div>';
  h+='<div class="card"><h2>Unterschrift Prüfer – '+esc(I.pruefer)+'</h2><canvas class="sig" id="sigP"></canvas><button class="btn" data-act="sigClear" data-k="sigP">Löschen</button></div>';
  h+='<div class="card"><h2>Unterschrift Kunde</h2><label class="f">Name Kunde (Vertreter)<input type="text" data-b="kundeName" value="'+esc(I.kundeName)+'"></label><canvas class="sig" id="sigK"></canvas><button class="btn" data-act="sigClear" data-k="sigK">Löschen</button></div>';
  h+='<div class="row"><button class="btn pri big" data-act="report">PDF-Bericht anzeigen</button></div>';
  main.innerHTML=h;
  $("#nx").addEventListener("change",function(){I.naechsteManuell=true;save()});
  sigPad("sigP");sigPad("sigK");
  void c;
};
function sigPad(k){
  var cv=$("#"+k),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1,draw=false,dirty=false,lx=0,ly=0;
  function size(){var r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0f2233";
    if(I[k]){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,r.width,r.height)};im.src=I[k]}}
  size();
  function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  cv.addEventListener("pointerdown",function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);draw=true;var p=pos(e);lx=p[0];ly=p[1];ctx.beginPath();ctx.arc(lx,ly,1.2,0,7);ctx.fill()});
  cv.addEventListener("pointermove",function(e){if(!draw)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];dirty=true});
  function end(){if(!draw)return;draw=false;if(dirty||true){I[k]=cv.toDataURL("image/png");save()}}
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}

/* ---------- Kundenbericht ---------- */
function buildKunde(){
  return loadPhotos(allPhotoIds(I)).then(function(P){
    var insp=JSON.parse(JSON.stringify(I));insp.firma=Object.assign({},SET.firma);
    delete insp.massAuto;
    var data=JSON.stringify({insp:insp,photos:P,logo:SET.logo||""}).replace(/</g,"\\u003c");
    var html='<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<title>Regalinspektion '+esc(I.kunde)+' '+fDate(I.datum)+'</title><style id="kst">'+$("#kcss").textContent+$("#rptcss").textContent+'</style></head><body>'
      +'<div class="app"></div><div id="print"></div><div id="lb" hidden><img alt="Foto gross"></div>'
      +'<script type="application/json" id="data">'+data+'<\/script>'
      +'<script id="shared">'+$("#shared").textContent+'<\/script><script id="kjs">'+$("#kjs").textContent+'<\/script></body></html>';
    return html;
  });
}

/* ---------- Datei speichern / teilen ---------- */
function saveFile(name,text,mime){
  var blob=new Blob([text],{type:mime});
  var file;try{file=new File([blob],name,{type:mime})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[file]})){return navigator.share({files:[file],title:name}).then(function(){toast("Geteilt")}).catch(function(e){if(e&&e.name==="AbortError")throw e;download(blob,name)})}}catch(e){}}
  download(blob,name);return Promise.resolve();
}
function download(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);toast("Gespeichert: "+name,3500)}
function exportJson(){
  return loadPhotos(allPhotoIds(I)).then(function(P){
    var n=I.maengel.length,miss=allPhotoIds(I).filter(function(id){return !P[id]}).length;
    var out={format:"regalinspektion-v1",exportiert:new Date().toISOString(),insp:I,photos:P};
    var hm=new Date().toTimeString().slice(0,5).replace(":","");
    return saveFile("Regalinspektion_"+slug(I.kunde||I.standort||"Sicherung")+"_"+I.datum+"_"+hm+".json",JSON.stringify(out),"application/json").then(function(){
      I.lastBackup=Date.now();I.backupN=I.maengel.filter(function(m){return m.stufe}).length;save();if(V.v==="insp")render();
      if(miss)errBanner(miss+" Foto(s) fehlen im Speicher und sind nicht in der Sicherung.");void n;
    });
  });
}
function readDataUrl(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(f)})}
function readFile(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsText(f)})}
var jsonMode="insp";
$("#fjson").addEventListener("change",function(e){
  var f=e.target.files[0];e.target.value="";if(!f)return;
  readFile(f).then(function(t){var d=JSON.parse(t);
    if(jsonMode==="rm"){
      if(d.format!=="regalinspektion-rueckmeldung-v1")throw new Error("Das ist keine Rückmeldungs-Datei.");
      if(d.inspId!==I.id&&!confirm("Die Rückmeldung gehört zu einer anderen Inspektion ("+(d.kunde||"")+"). Trotzdem einlesen?"))return;
      var n=0;I.maengel.forEach(function(m){var s=d.status&&d.status[m.id];if(s){m.kunde={status:s.status||"offen",datum:s.datum||"",notiz:s.notiz||""};n++}});
      save();toast(n+" Rückmeldungen eingelesen",3000);render();return;
    }
    if(d.format!=="regalinspektion-v1"||!d.insp)throw new Error("Das ist keine Inspektions-Sicherung.");
    return dget("insp",d.insp.id).then(function(ex){
      var X=d.insp;
      if(ex&&!confirm("Diese Inspektion ist schon vorhanden. OK = überschreiben, Abbrechen = als Kopie importieren.")){
        var map={};X=JSON.parse(JSON.stringify(X));X.id=uid();X.kunde=(X.kunde||"")+" (Kopie)";
        X.maengel.forEach(function(m){m.fotos=(m.fotos||[]).map(function(pid){var nid=uid();map[nid]=d.photos[pid];return nid})});
        d.photos=map;
      }
      var ps=Object.keys(d.photos||{}).map(function(pid){return dput("photos",{id:pid,insp:X.id,data:d.photos[pid]})});
      return Promise.all(ps).then(function(){return dput("insp",X)}).then(function(){toast("Importiert: "+(X.kunde||"Inspektion"),3000);PH=new Map();render()});
    });
  }).catch(function(err){toast("Import fehlgeschlagen: "+(err.message||err),5000)});
});
$("#flogo").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";if(!f)return;resizeImg(f,800,.9).then(function(d){SET.logo=d;return saveMeta("settings",SET)}).then(function(){render()}).catch(function(err){toast(err.message)})});
function onPhotoFiles(e){
  var files=[].slice.call(e.target.files||[]);e.target.value="";var m=findM(V.mid);if(!m||!files.length)return;
  toast("Foto wird gespeichert …",1500);
  var inspId=I.id;
  files.reduce(function(p,f){return p.then(function(){
      return resizeImg(f,1600,.75).catch(function(){return readDataUrl(f)}).then(function(d){
        var id=uid();return dput("photos",{id:id,insp:inspId,data:d}).then(function(){PH.set(id,d);m.fotos.push(id);save();renderPhotos(m)});
      });
    })},Promise.resolve())
    .then(function(){toast("✓ Foto gespeichert ("+m.fotos.length+" bei "+nrText(m.nr)+")")})
    .catch(function(err){errBanner("Foto konnte NICHT gespeichert werden ("+(err&&err.name||err)+"). Bitte erneut aufnehmen und danach «Sicherung jetzt» machen.")});
}
$("#fcam").addEventListener("change",onPhotoFiles);$("#fgal").addEventListener("change",onPhotoFiles);

  nextRegal:function(b){var from=b.dataset.from?zeileOf(I,b.dataset.from):null,nx=nextRegalFrom(from),z=nx.z||addRegal(nx.nr);
    if(V.v==="zeile"){V={v:"zeile",id:I.id,zid:z.id};history.replaceState(V,"");render();window.scrollTo(0,0)}else go("zeile",{id:I.id,zid:z.id});
    if(nx.neu)toast("Regal "+kNr(z.plakette)+" angelegt – Kleber aufkleben")},
  zeile:function(b){go("zeile",{id:I.id,zid:b.dataset.zid})},
  quickIO:function(b){var z=zeileOf(I,b.dataset.zid);z.checks=z.checks||{};btFor(z.typ).forEach(function(x){if(!zCheck(I,z,x.k).s)z.checks[x.k]="ok"});save();toast(rName(z)+": alle Bauteile i. O.");render()},
  allOk:function(){var z=zeileOf(I,V.zid);z.checks=z.checks||{};var n=0;btFor(z.typ).forEach(function(x){if(!zCheck(I,z,x.k).s){z.checks[x.k]="ok";n++}});save();toast(n+" Bauteile auf i. O. gesetzt");VIEWS.zeile()},
  chk:function(b){var z=zeileOf(I,V.zid),k=b.dataset.k,v=b.dataset.v;z.checks=z.checks||{};
    if(zCheck(I,z,k).s==="mangel"){toast("Hier sind Mängel erfasst – zuerst die Mängel löschen");return}
    z.checks[k]=z.checks[k]===v?"":v;save();var y=window.scrollY;VIEWS.zeile();window.scrollTo(0,y)},
  chkM:function(b){newMangel(V.zid,b.dataset.k)},
  help:function(b){var h=b.closest(".check").querySelector(".hp");if(h)h.hidden=!h.hidden},
  achk:function(b){I.allg=I.allg||{};var a=I.allg[b.dataset.k]=I.allg[b.dataset.k]||{};a.s=a.s===b.dataset.v?"":b.dataset.v;save();var y=window.scrollY;VIEWS.anlage();window.scrollTo(0,y)},
  newMangelAllg:function(){newMangel("","sonst")},
  delZeile:function(){var z=zeileOf(I,V.zid),n=I.maengel.filter(function(m){return m.zeileId===z.id}).length;
    if(!confirm(rName(z)+(n?" mit "+n+" Mängeln":"")+" löschen?"))return;
    I.maengel.filter(function(m){return m.zeileId===z.id}).forEach(function(m){(m.fotos||[]).forEach(function(p){ddel("photos",p)})});
    I.maengel=I.maengel.filter(function(m){return m.zeileId!==z.id});I.zeilen=I.zeilen.filter(function(x){return x!==z});save();history.back()},
  newMangel:function(b){newMangel(b.dataset.zid||V.zid)},
  editMangel:function(b){go("mangel",{id:I.id,mid:b.dataset.mid})},
  mset:function(b){var m=findM(V.mid);m.stufe=b.dataset.v;m.stufeVorschlag="";
    if(m.massAuto||!m.massnahme){m.massnahme=massVorschlag(m.art,m.stufe,m.bauteil);m.massAuto=true}
    save();var y=window.scrollY;VIEWS.mangel();window.scrollTo(0,y)},
  step:function(b){var m=findM(V.mid),v=(parseInt(m.nr,10)||0)+(+b.dataset.d);if(v<1)v=1;
    if(I.maengel.some(function(x){return x!==m&&x.nr===v})&&!confirm("Kleber "+nrText(v)+" ist schon vergeben. Trotzdem verwenden?"))return;
    m.nr=v;$("#m_nr").value=v;save();setHeader("Kleber "+nrText(v),true)},
  messOk:function(){messEinstufen()},
  hilfe:function(){go("hilfe",{id:I.id})},
  cam:function(){$("#fcam").click()},
  gal:function(){$("#fgal").click()},
  lb:function(b){if(b.src)lightbox(b.src)},
  delPhoto:function(b){if(!confirm("Foto löschen?"))return;var m=findM(V.mid);m.fotos=m.fotos.filter(function(p){return p!==b.dataset.pid});ddel("photos",b.dataset.pid);save();renderPhotos(m)},
  delMangel:function(){if(!confirm("Diesen Mangel löschen?"))return;var m=findM(V.mid);(m.fotos||[]).forEach(function(p){ddel("photos",p)});I.maengel=I.maengel.filter(function(x){return x!==m});save();history.back()},
  saveNext:function(){var m=findM(V.mid);if(!checkMangel(m))return;LAST.zeileId=m.zeileId;LAST.bk=m.bk;saveMeta("last",LAST);flushSave();toast("✓ "+nrText(m.nr)+" gespeichert");
    var n={id:uid(),nr:nextNr(),zeileId:m.zeileId,bk:m.bk,bauteil:m.bauteil,art:"",stufe:"",stufeVorschlag:"",feld:m.feld,ebene:"",seite:"",beschreibung:"",massnahme:"",massAuto:true,fotos:[],created:Date.now()};
    I.maengel.push(n);save();V={v:"mangel",id:I.id,mid:n.id};history.replaceState(V,"");render();window.scrollTo(0,0)},
  saveDone:function(){var m=findM(V.mid);if(isBlank(m)){history.back();return}if(!checkMangel(m))return;LAST.zeileId=m.zeileId;LAST.bk=m.bk;saveMeta("last",LAST);flushSave();toast("✓ "+nrText(m.nr)+" gespeichert");history.back()},
  abschluss:function(){go("abschluss",{id:I.id})},
  mehr:function(){go("mehr",{id:I.id})},

});

/* ---------- Start ---------- */
dput("meta",{k:"selbsttest",v:Date.now()}).then(function(){return dget("meta","selbsttest")}).then(function(x){if(!x)throw new Error("Selbsttest fehlgeschlagen")})
.then(function(){return Promise.all([dget("meta","settings"),dget("meta","last")])}).then(function(r){
  if(r[0]&&r[0].v)SET=r[0].v;SET.firma=Object.assign({},DEF_FIRMA,SET.firma||{});
  if(r[1]&&r[1].v)LAST=r[1].v;
}).catch(function(e){errBanner("Gerätespeicher nicht verfügbar ("+(e&&e.message||e)+"). So NICHT erfassen – nicht im privaten Modus öffnen, anderen Browser verwenden.");throw e}).then(function(){
  wake();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").then(function(reg){SWREG=reg}).catch(function(){});
    setTimeout(updCheck,2500);
  }
  V=history.state&&history.state.v?history.state:{v:"home"};
  if(V.v==="report")V={v:"insp",id:V.id};
  history.replaceState(V,"");render();
});
