<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Regalinspektion">
<title>Regalinspektion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Gleiche Formensprache wie Sicherheitsregister und Zählerprüfung:
   Kopfleiste mit Speicher-Anzeige, Kacheln als Filter, Tab-Leiste unten, eine Spalte */
:root{
  --ground:#E9EDEE; --surface:#FFFFFF; --surface-2:#F3F6F6;
  --ink:#0F1618; --ink-2:#48595D; --ink-3:#78898D;
  --line:#D2DADB; --line-strong:#B4C0C2;
  --accent:#0B6E77; --accent-ink:#FFFFFF; --accent-soft:#DCEDEE;
  --ok:#2C7A52; --ok-soft:#DCEDE3; --warn:#9C6B00; --warn-soft:#F7EBCE; --crit:#B3122C; --crit-soft:#F8DCE1;
  --tape:#F2C230; --tape-ink:#1B211F; --status-ink:#FFFFFF;
  --rot:var(--crit); --gelb:#C45F00; --gruen:var(--ok);
  --shadow:0 1px 2px rgba(15,22,24,.08),0 6px 18px rgba(15,22,24,.06);
  --r:6px;
  --f-ui:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-disp:Archivo,"Arial Narrow",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D1315; --surface:#161F21; --surface-2:#1D282B; --ink:#E6EDEC; --ink-2:#A2B2B4; --ink-3:#76888B;
  --line:#263336; --line-strong:#3A4A4D; --accent:#37A8B2; --accent-ink:#06181A; --accent-soft:#123338;
  --ok:#5FB587; --ok-soft:#122C20; --warn:#E3B24E; --warn-soft:#2E2413; --crit:#F2748A; --crit-soft:#33161C;
  --tape:#E6B927; --status-ink:#0D1315; --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfleiste */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;min-height:58px}
.topbar .back{background:none;border:0;min-width:44px;min-height:44px;font-size:30px;line-height:1;color:var(--accent);cursor:pointer;padding:0 4px;margin-left:-6px}
.mark{width:32px;height:32px;border-radius:4px;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .78rem var(--f-disp)}
.mark.haslogo{background:transparent;width:auto;max-width:90px}
.mark.haslogo img{height:30px;width:auto;display:block}
.tt{min-width:0;flex:1}
.topbar h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.topbar .sub{font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.synckn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);font:600 .76rem var(--f-ui);white-space:nowrap;flex:none}
.synckn .punkt{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.synckn.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}.synckn.ok .punkt{background:var(--ok)}
.synckn.laeuft .punkt{background:var(--accent);animation:puls 1s ease-in-out infinite}
.synckn.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}.synckn.crit .punkt{background:var(--crit)}
@keyframes puls{50%{opacity:.25}}
#upd{position:sticky;top:0;z-index:49;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600}
#upd span{flex:1}
#upd button{min-height:44px;border:0;border-radius:var(--r);background:var(--accent-ink);color:var(--accent);font:700 .95rem var(--f-disp);padding:0 14px;cursor:pointer}
.gross-aktion.zwei{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.gross-aktion.zwei svg{color:var(--accent)}
em.art{font-style:normal;font:700 .62rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);border-radius:4px;padding:1px 6px;margin-right:6px}
em.art.neu{background:var(--accent-soft);color:var(--accent)}
.card.nkopf{flex-direction:row;align-items:center}.nkopf .btn{flex:none}.nkopf div{flex:1;min-width:0}.nkopf b{display:block;font-size:1.05rem}.nkopf span{font-size:.82rem;color:var(--ink-3)}
.frow{display:flex;flex-direction:column;gap:5px}
.flab{display:flex;align-items:center;gap:8px;font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.flab span{flex:1}.flab .ib{width:34px;height:34px;font-size:1rem}
.selx{display:flex;flex-direction:column;gap:6px}
.fgrow,.lvrow{display:flex;gap:8px;align-items:center;margin:6px 0}.fgrow select{flex:1 1 auto;min-width:0}.fgrow select.n{flex:0 0 74px}.fgrow input{flex:0 0 96px;min-width:0}.fgrow .x{flex:0 0 48px;min-height:48px;padding:0}.lvrow{flex-wrap:wrap}.lvrow b{flex:0 0 100%;font-size:13px;color:var(--mut,#5b6b70)}.lvrow select{flex:1 1 200px;min-width:0}.lvrow input{flex:0 0 110px}
.seg.nseg.s2{grid-template-columns:1fr 1fr}.seg.nseg.s4{grid-template-columns:repeat(4,1fr)}
.seg.nseg button{font-size:.82rem;line-height:1.15;padding:4px}
.svgbox{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}.svgbox svg{width:100%;height:auto;display:block}
table.kz{width:100%;border-collapse:collapse;font-size:.88rem}table.kz td{padding:5px 2px;border-bottom:1px solid var(--line)}table.kz td:last-child{text-align:right;font-family:var(--f-mono);font-weight:600}
.skthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.skthumbs:empty{display:none}
.skth{border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;font-size:.75rem;color:var(--ink-2)}
.skth img{width:100%;aspect-ratio:1/1.414;object-fit:contain;background:#fff}
.skbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.skbar.sk2{grid-template-columns:repeat(8,1fr)}
.skbar button{min-height:48px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.skbar button b{font-size:1.2rem;line-height:1}.skbar button span{font-size:.6rem;font-weight:600;color:var(--ink-3)}
.skbar button.on{background:var(--accent-soft);border-color:var(--accent)}
.skbar .col i{width:24px;height:24px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.skbar .wd i{width:24px;background:var(--ink);border-radius:4px;display:block}
.skwrap{display:flex;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:4px}
#skc{touch-action:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);display:block}
.sktext{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:6px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:6px}
.sktext input{flex:1;min-width:0}.sktext .btn{min-height:48px}
#err{position:sticky;top:0;z-index:50;background:var(--crit);color:var(--status-ink);font-weight:600;padding:12px 14px;font-size:.95rem}

main{padding:12px 12px 110px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Tab-Leiste */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;
  font:600 .64rem var(--f-disp);letter-spacing:.04em;text-transform:uppercase;min-height:60px;border-top:2px solid transparent;margin-top:-1px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabbar button.plus{color:var(--status-ink);background:var(--crit);border-radius:14px;margin:6px 6px 4px;min-height:52px;border-top:0}
.tabbar button.plus svg{stroke-width:2.6}

/* Karten, Felder, Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.tight{padding:10px 12px;gap:8px}
.card.flush{padding:0;gap:0;overflow:hidden}
.card h2,.eyebrow{font:600 .7rem var(--f-disp);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0}
label.f{display:flex;flex-direction:column;gap:5px;font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],select,textarea{width:100%;min-height:50px;border:1px solid var(--line-strong);
  border-radius:var(--r);padding:10px 12px;background:var(--surface);font:400 1rem var(--f-ui);color:var(--ink);text-transform:none;letter-spacing:0}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 .92rem var(--f-disp);
  padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:60px;font-size:1.02rem;width:100%}
.btn.warn{border-color:var(--crit);color:var(--crit)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:.85rem;color:var(--ink-2)}
.hint{font-size:.85rem;color:var(--ink-3);margin:0}
.banner{padding:10px 12px;border-radius:var(--r);font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.92rem}

/* Grosse Aktion (Startseite) */
.gross-aktion{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:16px 18px;background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:8px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.gross-aktion svg{width:38px;height:38px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gross-aktion b{display:block;font:700 1.18rem var(--f-disp)}
.gross-aktion small{display:block;font-size:.88rem;opacity:.85;margin-top:2px}

/* Kacheln */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);
  padding:9px 8px;text-align:left;cursor:pointer;width:100%;min-height:68px}
.stat .n{display:block;font:700 1.7rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:.68rem;color:var(--ink-2);margin-top:5px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat.rot{border-top-color:var(--rot)}.stat.rot .n{color:var(--crit)}
.stat.gelb{border-top-color:var(--gelb)}.stat.gelb .n{color:var(--gelb)}
.stat.gruen{border-top-color:var(--gruen)}.stat.gruen .n{color:var(--ok)}
.stat.z{border-top-color:var(--accent)}
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress .zahl{font:500 .8rem var(--f-mono);color:var(--ink-2);white-space:nowrap}

/* Chips und Ampel */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:46px;padding:8px 13px;border-radius:24px;border:1px solid var(--line-strong);background:var(--surface);font-size:.95rem;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.amps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amp{min-height:74px;border-radius:8px;border:2px solid transparent;font:700 1.1rem var(--f-disp);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px}
.amp small{font:600 .72rem var(--f-ui);margin-top:4px}
.amp.rot{background:var(--crit-soft);color:var(--crit)} .amp.rot.on{background:var(--rot);color:#fff;border-color:var(--ink)}
.amp.gelb{background:#FDE9DA;color:#8A3F00} .amp.gelb.on{background:var(--gelb);color:#fff;border-color:var(--ink)}
.amp.gruen{background:var(--ok-soft);color:var(--ok)} .amp.gruen.on{background:var(--gruen);color:#fff;border-color:var(--ink)}
.amps.missing .amp{border-color:var(--crit);border-style:dashed}
.stepper{display:grid;grid-template-columns:50px 1fr 50px;gap:6px;align-items:center}
.stepper button{min-height:50px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-size:1.5rem;font-weight:700;cursor:pointer;color:var(--ink)}
.stepper input{text-align:center;font-family:var(--f-mono)}

/* Listen wie im Sicherheitsregister */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;
  width:100%;text-align:left;min-height:62px;color:inherit}
.list>:last-child,.list>:last-child .item{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:.8rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.zrow .item{border-bottom:0}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dot{min-width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font:700 .85rem var(--f-disp);padding:0 6px}
.dot.rot{background:var(--rot);color:#fff}.dot.gelb{background:var(--gelb);color:#fff}.dot.gruen{background:var(--gruen);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:600 .68rem var(--f-disp);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.offen{background:var(--surface-2);color:var(--ink-2)}.pill.io{background:var(--ok-soft);color:var(--ok)}.pill.gp{background:var(--accent-soft);color:var(--accent)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.qio{min-width:74px;border:0;border-left:1px solid var(--line);background:var(--ok-soft);color:var(--ok);font:700 .9rem var(--f-disp);cursor:pointer}
.qio.del{background:var(--crit-soft,#FBE7EA);color:var(--crit)}
.loeschfrage{border:2px solid var(--crit)}.loeschfrage h2{color:var(--crit)}.loeschfrage .row{margin-top:10px}
.btn.krit{background:var(--crit);border-color:var(--crit);color:#fff}
.mg{box-shadow:inset 6px 0 0 var(--line-strong)}
.mg.rot{box-shadow:inset 6px 0 0 var(--rot)}.mg.gelb{box-shadow:inset 6px 0 0 var(--gelb)}.mg.gruen{box-shadow:inset 6px 0 0 var(--gruen)}
.mg img{width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none;border:1px solid var(--line)}
.nr{font-family:var(--f-mono);font-weight:600;color:var(--accent);margin-right:6px}
.lb{font:600 .7rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 11px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px!important}
.check{border-bottom:1px solid var(--line);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.check:last-child{border-bottom:0}
.check.hatm{box-shadow:inset 4px 0 0 var(--crit)}
.check .q{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:8px}
.check .lt{flex:1;min-width:0}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);font-size:1.1rem;cursor:pointer}
.hp{font-size:.88rem;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;line-height:1.45}
.check .code{font:600 .72rem var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2);margin-top:2px}
details.info{margin-left:auto}
details.info summary{list-style:none;cursor:pointer;color:var(--accent);font-size:1.15rem;min-width:36px;min-height:32px;text-align:center}
details.info summary::-webkit-details-marker{display:none}
details.info p{font-weight:400;font-size:.88rem;color:var(--ink-2);margin:4px 0 0;flex-basis:100%}
details.info[open]{flex-basis:100%;margin-left:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);min-height:48px;cursor:pointer;font:600 .85rem var(--f-disp);color:var(--ink-2)}
.seg button[data-on="ok"]{background:var(--ok);border-color:var(--ok);color:var(--status-ink)}
.seg button[data-on="mangel"],.seg button[data-on="fehlt"]{background:var(--crit);border-color:var(--crit);color:var(--status-ink)}
.seg button[data-on="nv"],.seg button[data-on="na"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
body.gross .seg button{min-height:58px;font-size:.95rem}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line-strong);border-left:5px solid var(--line-strong);background:var(--surface-2);border-radius:6px;padding:7px 10px;min-height:44px;cursor:pointer;font-size:.88rem;text-align:left;color:var(--ink)}
.mchip b{font-family:var(--f-mono)}
.mchip.rot{border-left-color:var(--rot)}.mchip.gelb{border-left-color:var(--gelb)}.mchip.gruen{border-left-color:var(--gruen)}
.check textarea{min-height:60px}
.kl{display:flex;flex-direction:column;gap:4px}
.kl input{font:700 1.5rem var(--f-mono);text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick .chip{border-radius:var(--r);text-align:left;line-height:1.2;padding:8px 10px;font-size:.9rem}
body.gross .quick .chip{font-size:.95rem;padding:8px 10px}
.filterchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filterchips .chip{flex:none}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--surface-2);max-width:100%;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;cursor:pointer}

/* Speicherleiste im Mangel */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.bar .btn{flex:1;min-height:56px;font-size:1rem}
.sig{width:100%;height:170px;border:1px dashed var(--line-strong);border-radius:var(--r);background:#fff;touch-action:none;display:block}

/* Sicherungsstatus */
.bk{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:9px 12px}
.bk.ok{background:var(--ok-soft);color:var(--ok)}
.bk div{flex:1;min-width:0}.bk b{display:block;font-size:.9rem}.bk span{font-size:.78rem;opacity:.9}
.bk .btn{min-height:44px;flex:none;background:var(--surface)}

/* Hilfe wie im Sicherheitsregister */
.help{background:var(--accent-soft)}
.help p{margin:0;font-size:.92rem}
.mess{display:flex;flex-direction:column;gap:8px}
details.hilfe{border-bottom:1px solid var(--line)}
details.hilfe:last-child{border-bottom:0}
details.hilfe summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:54px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.hilfe summary::-webkit-details-marker{display:none}
details.hilfe summary::after{content:'+';font-size:1.4rem;color:var(--accent);font-weight:400}
details.hilfe[open] summary::after{content:'−'}
details.hilfe>div{padding:0 16px 14px;color:var(--ink-2);font-size:.95rem;line-height:1.55}
details.hilfe p{margin:0 0 8px}
.pl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card>summary{list-style:none;min-height:40px;display:flex;align-items:center;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2::after{content:" +";color:var(--accent);font-size:1rem}
details.card[open]>summary h2::after{content:" −"}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.rptbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center}
#rptview{background:#fff;color:#111}
#rptview .rp{padding:12px}

/* Handschuhmodus */
body.gross{font-size:18px}
body.gross .btn{min-height:58px;font-size:1rem}
body.gross .chip{min-height:54px;font-size:1.02rem;padding:10px 15px}
body.gross .amp{min-height:88px;font-size:1.25rem}
body.gross .item{min-height:74px}
body.gross .stepper{grid-template-columns:60px 1fr 60px}
body.gross .stepper button,body.gross input,body.gross select{min-height:58px}
body.gross .tabbar button{min-height:66px}
body.gross .qio{min-width:86px}

@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body>*:not(#rptview){display:none!important}
  #rptview .rptbar,#rptview .noprint{display:none!important}
  #rptview .rp{padding:0}
}

  var emp=[];

  if(fehlt.length){var byB={};fehlt.forEach(function(m){byB[m.bauteil]=(byB[m.bauteil]||[]).concat(NR[m.id])});Object.keys(byB).forEach(function(b){emp.push("«"+b+"» nachrüsten ("+byB[b].join(", ")+").")})}
  if(c.rot)emp.push("Rot markierte Bereiche sofort entladen und bis zur Instandsetzung sperren.");
  emp.push("Beschädigte Bauteile nur durch Originalteile des Herstellers ersetzen; nicht richten oder schweissen.");
  emp.push("Nächste Inspektion durch eine fachkundige Person bis "+fDate(I.naechste||addMonths(I.datum,12))+".");
  h+='<section><h2>6. Empfehlungen</h2><ol class="emp">'+emp.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ol>';
  h+='<h2>7. Ohne Mängel beurteilte Regale</h2><p>'+(io.length?io.map(function(z){return esc(rName(z))}).join(", "):"–")+'</p>';

<script type="text/plain" id="kcss">

.hd{background:var(--brand);color:#fff;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.hd h1{margin:0;font-size:22px}.hd p{margin:2px 0 0;opacity:.85;font-size:14px}
.hd .t{flex:1;min-width:200px}

.b{min-height:44px;border-radius:8px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
.b.w{border-color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{border:2px solid transparent;border-radius:10px;padding:10px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit}

.kpi.rot b{color:var(--rot)}.kpi.gelb b{color:#c45f00}.kpi.gruen b{color:var(--gruen)}

.m.rot{border-left-color:var(--rot)}.m.gelb{border-left-color:var(--gelb)}.m.gruen{border-left-color:var(--gruen)}
.mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mh b{font-size:18px}
.bd{font-size:12px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:5px;color:#fff}
.bd.rot{background:var(--rot)}.bd.gelb{background:var(--gelb);color:#fff}.bd.gruen{background:var(--gruen)}
.st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:5px;background:#dfe6ee;color:var(--mut);margin-left:auto}
.st.arbeit{background:#fde9da;color:#8a3f00}.st.behoben{background:#e3f3e4;color:var(--gruen)}
.dl{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;font-size:15px}
.dl dt{color:var(--mut)}.dl dd{margin:0;min-width:0}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph img{width:110px;height:110px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.ed{border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:auto 160px;gap:8px;align-items:center}
.seg{display:flex;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--brand);font:inherit;font-weight:700;min-height:42px;padding:0 10px;cursor:pointer;flex:1}
.seg button.on{background:var(--brand);color:#fff}
.ed input,.ed textarea{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;min-height:42px;width:100%;background:#fff}
.ed textarea{grid-column:1/-1;min-height:60px;resize:vertical}
details.info{background:var(--card);border-radius:10px;padding:10px 14px}
details.info summary{cursor:pointer;font-weight:700}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#print{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1b6aa5;outline-offset:1px}
@media (max-width:560px){.ed{grid-template-columns:1fr}.dl{grid-template-columns:96px 1fr}}
.edp{background:var(--card);border:2px solid var(--brand);border-radius:10px;padding:14px}
.edp h2{margin:0 0 4px;font-size:18px}.edp .hint{margin:0 0 10px;color:var(--mut);font-size:14px}
.edp .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.edp label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--mut)}
.edp .w{grid-column:1/-1}
.edp input,.edp select,.edp textarea,.dl select,.dl textarea{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-weight:400;color:var(--ink);min-height:42px;width:100%;background:#fff}
.edp textarea,.dl textarea{min-height:70px;resize:vertical}
@media print{.app,#lb{display:none!important}#print{display:block}body{background:#fff}}
</script>
<script type="text/plain" id="kjs">
var D=JSON.parse(document.getElementById("data").textContent);

function init(){

  +'<select id="fsort"><option value="stufe">Sortierung: Stufe</option><option value="nr">Sortierung: Nummer</option><option value="zeile">Sortierung: Regal</option><option value="frist">Sortierung: Frist</option></select></div>'

  $("#hd").addEventListener("click",onHead);
  $("#edp").addEventListener("input",onPanel);$("#edp").addEventListener("change",onPanel);
  $("#lb").addEventListener("click",function(){this.hidden=true});
  $("#list").addEventListener("click",onList);
  $("#list").addEventListener("change",onEdit);
  $("#list").addEventListener("input",onEdit);
  $("#kpis").addEventListener("click",function(e){var b=e.target.closest(".kpi");if(!b)return;var k=b.dataset.k,v=b.dataset.v;
    if(k==="all"){F.stufe="";F.status=""}else{F[k]=F[k]===v?"":v}
    $("#fstufe").value=F.stufe;$("#fstatus").value=F.status;render()});

function head(){
  $("#hd").innerHTML=(LOGO?'<img src="'+LOGO+'" alt="Logo">':'')+'<div class="t"><h1>Regalinspektion '+esc(I.kunde||"")+'</h1><p>'+esc(I.standort||"")+(I.standort?' · ':'')+fDate(I.datum)+' · Prüfer '+esc(I.pruefer)+' · DIN EN 15635</p></div><div class="act">'
  +(EDIT?'<button class="b w" data-h="savehtml">Als HTML-Datei speichern</button><button class="b w" data-h="edit">Bearbeiten beenden</button>':'<button class="b w" data-h="edit">Bearbeiten</button><button class="b w" data-h="exp">Rückmeldung exportieren</button>')

function info(){
  $("#info").innerHTML='<summary>Ampelsystem und Hinweise</summary><p><b style="color:var(--rot)">Rot:</b> '+esc(STUFEN.rot.t)+'<br><b style="color:#c45f00">Orange:</b> '+esc(STUFEN.gelb.t)+'<br><b style="color:var(--gruen)">Grün:</b> '+esc(STUFEN.gruen.t)+'</p><p>Sie können pro Mangel den Status, ein Erledigungsdatum und eine Notiz eintragen. Die Angaben bleiben in diesem Browser gespeichert. Mit «Rückmeldung exportieren» erhalten Sie eine Datei, die Sie an '+esc((I.firma&&I.firma.email)||"den Prüfer")+' zurücksenden.</p>'+(I.gesamt?'<p><b>Gesamtbeurteilung:</b> '+nl(I.gesamt)+'</p>':'')+'<p>Nächste Inspektion: <b>'+fDate(I.naechste||addMonths(I.datum,12))+'</b></p>';

  +'<label>Belastungsschild<select data-p="schild">'+opts([{v:"ja",l:"vorhanden"},{v:"nein",l:"nicht vorhanden"}],I.schild,"nicht erfasst")+'</select></label>'

function onPanel(e){
  if(e.target.dataset.logo&&e.type==="change"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);LOGO=c.toDataURL("image/jpeg",.9);saveED();head()};im.src=r.result};r.readAsDataURL(f);return}

function kpis(){

}
function render(){
  kpis();
  var zi={};I.zeilen.forEach(function(z,i){zi[z.id]=i});
  var r=L.filter(function(m){
    if(F.stufe&&m.stufe!==F.stufe)return false;if(F.zeile&&m.zeileId!==F.zeile)return false;

function parseNames(s){
  var out=[];String(s).split(/[,;\n]+/).forEach(function(t){
    t=t.trim();if(!t)return;var m;
    if((m=t.match(/^([A-Za-z])\s*-\s*([A-Za-z])$/))){var a=m[1].toUpperCase().charCodeAt(0),b=m[2].toUpperCase().charCodeAt(0);if(a<=b)for(var i=a;i<=b;i++)out.push(String.fromCharCode(i));return}
    if((m=t.match(/^(\D*?)(\d+)\s*-\s*\D*?(\d+)$/))){var x=+m[2],y=+m[3];if(x<=y&&y-x<500)for(var j=x;j<=y;j++)out.push(m[1]+j);return}
    out.push(t);
  });return out;
}

function sigPad(k){
  var cv=$("#"+k),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1,draw=false,dirty=false,lx=0,ly=0;
  function size(){var r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0f2233";
    if(I[k]){var im=new Image();im.onload=function(){ctx.drawImage(im,0,0,r.width,r.height)};im.src=I[k]}}
  size();
  function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  cv.addEventListener("pointerdown",function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);draw=true;var p=pos(e);lx=p[0];ly=p[1];ctx.beginPath();ctx.arc(lx,ly,1.2,0,7);ctx.fill()});
  cv.addEventListener("pointermove",function(e){if(!draw)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p[0],p[1]);ctx.stroke();lx=p[0];ly=p[1];dirty=true});
  function end(){if(!draw)return;draw=false;if(dirty||true){I[k]=cv.toDataURL("image/png");save()}}
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}

function saveFile(name,text,mime){
  var blob=new Blob([text],{type:mime});
  var file;try{file=new File([blob],name,{type:mime})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[file]})){return navigator.share({files:[file],title:name}).then(function(){toast("Geteilt")}).catch(function(e){if(e&&e.name==="AbortError")throw e;download(blob,name)})}}catch(e){}}
  download(blob,name);return Promise.resolve();
}
function download(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);toast("Gespeichert: "+name,3500)}

      I.lastBackup=Date.now();I.backupN=isNeu(I)?(I.anlagen||[]).length:I.maengel.filter(function(m){return m.stufe}).length;save();if(V.v==="insp"||V.v==="nhome")render();
